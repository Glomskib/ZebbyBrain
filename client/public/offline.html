<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zebby — Offline</title>
  <style>
    body {
      font: 16px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0d0f12;
      color: #fff;
      margin: 0;
      display: grid;
      place-items: center;
      height: 100svh;
    }
    .card {
      padding: 24px;
      max-width: 520px;
      border-radius: 16px;
      background: #14161b;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      color: #8b5cf6;
    }
    p {
      line-height: 1.6;
      color: #a1a1aa;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🦓 You're offline</h1>
    <p>Zebby works best online. We'll reconnect as soon as you're back.</p>
    <p>You can still open the app shell from your home screen.</p>
  </div>
</body>
</html>
